name: BicepGuard gated deploy
on:
  push:
    branches: [ main ]
jobs:
  bicepguard:
    name: BicepGuard Admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit BicepGuard admission
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const main = fs.readFileSync('main.bicep').toString('base64');
          const parameters = undefined;
          const payload = {
            pipeline_id: `${process.env.GITHUB_REPOSITORY}/${process.env.GITHUB_RUN_ID}`,
            team_id: 'platform',
            environment: 'prod',
            scope: '/subscriptions/<subscription-id>/resourceGroups/<resource-group>',
            artifacts: { main_bicep: main, ...(parameters ? { parameters } : {}) },
            options: { cost_check: true, ai_risk_score: true, fail_on_warn: false }
          };
          fetch('http://ca-admit-bicepguard-ly5af3vo.delightfulisland-b76b0b7f.eastus.azurecontainerapps.io/v1/admissions', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload)
          }).then(async (response) => {
            const result = await response.json();
            console.log(JSON.stringify(result, null, 2));
            if (!response.ok || result.decision === 'DENY') process.exit(1);
          });
          NODE
  deploy:
    needs: bicepguard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only after BicepGuard passes
        run: az deployment group create --template-file main.bicep --resource-group atom8-test-rg
